name: Publish authorized GitHub Release

on:
  pull_request:
    paths:
      - 'migration/release-plan-v4.18.7.json'
      - 'migration/release-authorization-v4.18.7.json'
      - 'releases/VBAUpdater_Update_4.18.7.zip'
      - 'releases/VBAUpdater_Update_4.18.7_SHA256.txt'
      - '.github/workflows/publish-authorized-release.yml'
  push:
    branches:
      - main
    paths:
      - 'migration/release-plan-v4.18.7.json'
      - 'migration/release-authorization-v4.18.7.json'
      - 'releases/VBAUpdater_Update_4.18.7.zip'
      - 'releases/VBAUpdater_Update_4.18.7_SHA256.txt'
      - '.github/workflows/publish-authorized-release.yml'

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate exact authorization binding
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, sys
          plan = json.loads(pathlib.Path('migration/release-plan-v4.18.7.json').read_text(encoding='utf-8'))
          auth = json.loads(pathlib.Path('migration/release-authorization-v4.18.7.json').read_text(encoding='utf-8'))
          required = [
              (plan.get('authorizationId'), auth.get('id'), 'authorizationId'),
              (plan.get('productId'), auth.get('productId'), 'productId'),
              ('tanaka456jp/VBAUpdater-Releases', auth.get('repository'), 'repository'),
              (plan.get('tag'), auth.get('tag'), 'tag'),
              (plan.get('asset', {}).get('fileName'), auth.get('assetFileName'), 'assetFileName'),
              (plan.get('asset', {}).get('sha256', '').upper(), auth.get('assetSha256', '').upper(), 'assetSha256'),
              (bool(plan.get('draft')), bool(auth.get('draft')), 'draft'),
              (bool(plan.get('prerelease')), bool(auth.get('prerelease')), 'prerelease'),
          ]
          failed = [name for a, b, name in required if a != b]
          if auth.get('approved') is not True or auth.get('visibility') != 'public':
              failed.append('approval')
          if plan.get('profile') != 'github-release-migration-v1' or auth.get('profile') != 'github-release-publication-authorization-v1':
              failed.append('profile')
          if failed:
              raise SystemExit('authorization mismatch: ' + ', '.join(failed))
          asset_path = pathlib.Path(plan['asset']['path'])
          if not asset_path.is_file():
              raise SystemExit(f'missing asset: {asset_path}')
          actual = hashlib.sha256(asset_path.read_bytes()).hexdigest().upper()
          expected = plan['asset']['sha256'].upper()
          if actual != expected:
              raise SystemExit(f'asset SHA-256 mismatch: expected={expected} actual={actual}')
          sha_text = pathlib.Path(plan['shaFile']).read_text(encoding='utf-8-sig').upper()
          if expected not in sha_text or plan['asset']['fileName'].upper() not in sha_text:
              raise SystemExit('SHA file does not bind the expected artifact')
          print('Authorization and artifact binding: PASS')
          PY

      - name: Pull request validation only
        if: github.event_name == 'pull_request'
        run: echo 'Validation PASS. External Release mutation is disabled on pull_request.'

      - name: Publish or reconcile exact GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(jq -r '.tag' migration/release-plan-v4.18.7.json)"
          TITLE="$(jq -r '.title' migration/release-plan-v4.18.7.json)"
          ASSET_PATH="$(jq -r '.asset.path' migration/release-plan-v4.18.7.json)"
          FILE_NAME="$(jq -r '.asset.fileName' migration/release-plan-v4.18.7.json)"
          SHA_FILE="$(jq -r '.shaFile' migration/release-plan-v4.18.7.json)"
          EXPECTED="$(jq -r '.asset.sha256' migration/release-plan-v4.18.7.json | tr '[:lower:]' '[:upper:]')"
          jq -r '.releaseNotes' migration/release-plan-v4.18.7.json > /tmp/release-notes.md

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; entering reconciliation mode."
          else
            gh release create "$TAG" "$ASSET_PATH" "$SHA_FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes-file /tmp/release-notes.md \
              --target "$GITHUB_SHA"
          fi

          rm -rf /tmp/vbaupdater-release-verify
          mkdir -p /tmp/vbaupdater-release-verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$FILE_NAME" --dir /tmp/vbaupdater-release-verify
          ACTUAL="$(sha256sum "/tmp/vbaupdater-release-verify/$FILE_NAME" | awk '{print toupper($1)}')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Published asset SHA-256 mismatch: expected=$EXPECTED actual=$ACTUAL"
            exit 1
          fi

          RELEASE_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          DRAFT="$(printf '%s' "$RELEASE_JSON" | jq -r '.draft')"
          PRERELEASE="$(printf '%s' "$RELEASE_JSON" | jq -r '.prerelease')"
          ASSET_COUNT="$(printf '%s' "$RELEASE_JSON" | jq --arg name "$FILE_NAME" '[.assets[] | select(.name == $name)] | length')"
          if [ "$DRAFT" != 'false' ] || [ "$PRERELEASE" != 'false' ] || [ "$ASSET_COUNT" != '1' ]; then
            echo 'Published release identity is not the authorized public/stable exact-asset state.'
            exit 1
          fi

          python - <<'PY'
          import json, pathlib
          plan = json.loads(pathlib.Path('migration/release-plan-v4.18.7.json').read_text(encoding='utf-8'))
          latest = dict(plan['latest'])
          latest['distributionMode'] = 'github-release'
          latest['releaseTag'] = plan['tag']
          latest['downloadUrl'] = f"https://github.com/tanaka456jp/VBAUpdater-Releases/releases/download/{plan['tag']}/{plan['asset']['fileName']}"
          latest['customerReady'] = bool(plan.get('customerReady'))
          pathlib.Path('latest.json').write_text(json.dumps(latest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          readme = f"""# VBAUpdater Releases

Latest: {latest['version']}

- distribution: GitHub Releases
- tag: `{plan['tag']}`
- self-update package: `{plan['asset']['fileName']}`
- SHA-256: `{plan['asset']['sha256']}`
- manifest: `latest.json`
- customer-ready fresh installer: {'yes' if plan.get('customerReady') else 'not yet; required before first external customer distribution'}

GitHub Release assets are the canonical binary distribution channel. `latest.json` is the mutable pointer used by the VBAUpdater self-update client.
"""
          pathlib.Path('README.md').write_text(readme, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json README.md
          if git diff --cached --quiet; then
            echo 'latest.json and README.md already reconciled.'
          else
            git commit -m 'Point VBAUpdater self-update channel to GitHub Release v4.18.7'
            git push origin HEAD:main
          fi
